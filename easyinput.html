<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Eisenbahn Fahrzeitrechner (Textformat)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    textarea, input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Fahrzeitrechner (Textformat)</h1>

  <label for="eingabe">Eingabe (Start, Abschnitte, Ziel):</label>
  <textarea id="eingabe" rows="8" placeholder="Oslo S
0.7km 40km/h
2.75km 110km/h
12.51km 210km/h
1.44km 160km/h
Lillestrøm"></textarea>

  <label for="beschleunigung">Beschleunigung (m/s²):</label>
  <input type="number" id="beschleunigung" value="0.75">

  <label for="verzoegerung">Verzögerung (m/s²):</label>
  <input type="number" id="verzoegerung" value="1">

  <button onclick="verarbeiten()">Berechnen</button>

  <div id="result"></div>

  <script>
    function berechneGesamtzeit(v0, vmax, vf, a_acc, a_dec, s_total) {
      const t1 = (vmax - v0) / a_acc;
      const s1 = v0 * t1 + 0.5 * a_acc * Math.pow(t1, 2);

      const t3 = (vmax - vf) / a_dec;
      const s3 = vf * t3 + 0.5 * a_dec * Math.pow(t3, 2);

      const s_beschleunigung_und_bremsen = s1 + s3;

      if (s_total < s_beschleunigung_und_bremsen) {
        const a_eff = (a_acc * a_dec) / (a_acc + a_dec);
        const unter_wurzel = Math.pow(v0, 2) + 2 * a_eff * s_total;

        if (unter_wurzel < 0) {
          throw new Error("Unmögliche Bewegung mit den gegebenen Parametern.");
        }

        const vmax_eff = Math.sqrt(unter_wurzel);

        const t1_eff = vmax_eff > v0 ? (vmax_eff - v0) / a_acc : 0;
        const t3_eff = vmax_eff > vf ? (vmax_eff - vf) / a_dec : 0;

        return t1_eff + t3_eff;
      } else {
        const s2 = s_total - s1 - s3;
        const t2 = s2 > 0 ? s2 / vmax : 0;

        return t1 + t2 + t3;
      }
    }

    function berechneMehrereAbschnitte(a_acc, a_dec, vmax_list, strecken_list) {
      if (vmax_list.length !== strecken_list.length) {
        throw new Error("Die Listen für Höchstgeschwindigkeiten und Strecken müssen gleich lang sein.");
      }

      let gesamtzeit = 0;
      let v0 = 0;
      let vf = 0;

      for (let i = 0; i < vmax_list.length; i++) {
        const vmax = vmax_list[i];

        if (i < vmax_list.length - 1) {
          vf = Math.min(vmax_list[i + 1], vmax);
        } else {
          vf = 0;
        }

        const s = strecken_list[i];

        const zeit_abschnitt = berechneGesamtzeit(v0 / 3.6, vmax / 3.6, vf / 3.6, a_acc, a_dec, s * 1000);
        gesamtzeit += zeit_abschnitt;

        v0 = vf;
      }

      return gesamtzeit / 60;
    }

    function verarbeiten() {
      const eingabe = document.getElementById("eingabe").value.trim().split("\n").map(s => s.trim()).filter(s => s.length > 0);
      const beschleunigung = parseFloat(document.getElementById("beschleunigung").value);
      const verzoegerung = parseFloat(document.getElementById("verzoegerung").value);

      if (eingabe.length < 3) {
        document.getElementById("result").innerText = "Bitte mindestens Start, einen Abschnitt und Ziel eingeben.";
        return;
      }

      const start = eingabe[0];
      const ziel = eingabe[eingabe.length - 1];
      const abschnitte = eingabe.slice(1, -1);

      const streckenList = [];
      const vmaxList = [];

      for (let zeile of abschnitte) {
        const match = zeile.match(/([\d.]+)\s*km\s+([\d.]+)\s*km\/h/i);
        if (!match) {
          document.getElementById("result").innerText = `Ungültige Zeile: "${zeile}"`;
          return;
        }
        streckenList.push(parseFloat(match[1]));
        vmaxList.push(parseFloat(match[2]));
      }

      try {
        const gesamtzeit = berechneMehrereAbschnitte(beschleunigung, verzoegerung, vmaxList, streckenList);
        const reserve = gesamtzeit * 1.08;
        document.getElementById("result").innerText =
          `${start} - ${ziel}: ${gesamtzeit.toFixed(2)} min (${reserve.toFixed(2)} min mit 8 % Reserve)`;
      } catch (error) {
        document.getElementById("result").innerText = `Fehler: ${error.message}`;
      }
    }
  </script>
</body>
</html>
